name: CI

on:
    push:
        branches: [main]
    pull_request:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npm run typecheck
            - run: npm run lint
            - run: npm run format:check
            - run: npm run test
            - run: npm run audit:check
            - run: npm run secrets:check
            - run: npm run licenses:check
            - run: npm run style:check
            - run: npm run deadcode:check
            - run: npm run order:check
            - run: npm run dup:check
            - run: npm run manifest:check
            - run: npm run pipeline:check
            - run: npm run refactor:check
            - run: npm run tsconfig:check
            - run: npm run check:package
