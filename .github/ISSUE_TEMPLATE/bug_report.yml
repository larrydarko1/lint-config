name: Bug report
description: A rule, a gate or the CLI behaves differently than it should
labels: ['bug']
body:
    - type: markdown
      attributes:
          value: '**Security vulnerability? Stop** — email the maintainer at <hello@larrydarko.dev> instead. A public issue is a disclosure before there is a fix.'

    - type: textarea
      id: what
      attributes:
          label: What happened
          description: What you expected, and what happened instead. A false positive and a missed finding are both bugs.
      validations:
          required: true

    - type: textarea
      id: reproduce
      attributes:
          label: Steps to reproduce
          description: The smallest config and file that show it. If it only happens in a particular layout or with a particular option, say so — that is usually the actual bug.
      validations:
          required: true

    - type: textarea
      id: output
      attributes:
          label: Output
          description: The full output of the command that failed, such as `npx larry check <gate>` or `npx eslint <file>`.
          render: shell
      validations:
          required: false

    - type: input
      id: version
      attributes:
          label: Package version
          description: The installed version of `@larrydarko/lint-config` (`npm ls @larrydarko/lint-config`).
          placeholder: 0.1.0
      validations:
          required: true

    - type: input
      id: node
      attributes:
          label: Node version
          placeholder: 24.11.0
      validations:
          required: true

    - type: dropdown
      id: family
      attributes:
          label: Project family
          options:
              - fullstack
              - api
              - electron
              - library
              - spa
              - tauri
              - base
              - None (a single config or gate on its own)
      validations:
          required: true
